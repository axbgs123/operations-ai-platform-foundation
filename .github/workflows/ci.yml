name: Foundation quality and supply-chain gates

on:
  pull_request:
  push:
    branches: [main]

# Fork PRs receive the default read-only token and this workflow declares no secrets.
permissions:
  contents: read

jobs:
  quality-and-supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # v4.0.0
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 11.7.0

      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12.0
          cache: pnpm

      # v8.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project apps/api --frozen

      - name: Enforce documentation and CI policy contracts
        run: |
          uv run --project apps/api python scripts/release-security.py verify-docs --root . --readme README.md --require-compose-config
          uv run --project apps/api python scripts/release-security.py verify-demo-screenshot --path docs/assets/public-demo-synthetic-v1.png
          uv run --project apps/api python scripts/release-security.py verify-ci --path .github/workflows/ci.yml
          uv run --project apps/api python scripts/release-security.py verify-exceptions --path .github/security-exceptions.yml

      - name: Scan current tree and complete Git history without revealing matches
        run: |
          bash scripts/secret-scan.sh
          bash scripts/secret-scan.sh --history
          # v8.28.0, manifest-list digest sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 detect --source /repo --log-opts="--all" --redact

      - name: Audit production dependencies by ecosystem
        run: |
          pnpm audit --prod --audit-level high
          uv run --project apps/api --with "pip-audit==2.9.0" pip-audit --strict

      - name: Start isolated integration dependencies
        run: docker compose -f infra/docker/compose.yml up -d --wait postgres redis object-storage

      - name: Apply migrations
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: Verify generated contracts and application quality
        run: |
          pnpm schemas:check
          pnpm metrics:check
          pnpm lint
          pnpm typecheck
          pnpm test
          uv run --project apps/api ruff check .
          uv run --project apps/api mypy app
          uv run --project apps/api pytest apps/api/tests -q -W error::DeprecationWarning
          uv run --project apps/api python -m app.modules.risk_rag.evaluation --fixtures apps/api/tests/fixtures/risk_eval
          (cd apps/api && uv run alembic check && uv run python -m app.core.schema_consistency)

      - name: Build final API and Web images
        run: |
          docker compose -f infra/docker/compose.yml config --quiet
          docker compose -f infra/docker/compose.yml build api web

      - name: Create an allowlisted source release staging directory
        run: |
          mkdir -p artifacts/source-release
          git archive --format=tar HEAD | tar -xf - -C artifacts/source-release
          uv run --project apps/api python scripts/release-security.py verify-source-release --path artifacts/source-release

      - name: Generate and validate source and final-image SPDX SBOMs
        run: |
          mkdir -p artifacts/sbom
          uv run --project apps/api python scripts/release-security.py generate-sbom --output artifacts/sbom
          uv run --project apps/api python scripts/release-security.py verify-sbom --path artifacts/sbom/api.spdx.json
          uv run --project apps/api python scripts/release-security.py verify-sbom --path artifacts/sbom/web.spdx.json
          # v1.44.0, manifest-list digest sha256:86fde6445b483d902fe011dd9f68c4987dd94e07da1e9edc004e3c2422650de6
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/artifacts/sbom:/output" anchore/syft@sha256:86fde6445b483d902fe011dd9f68c4987dd94e07da1e9edc004e3c2422650de6 operations-ai-platform-api:local -o spdx-json=/output/image-api-final.spdx.json
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/artifacts/sbom:/output" anchore/syft@sha256:86fde6445b483d902fe011dd9f68c4987dd94e07da1e9edc004e3c2422650de6 operations-ai-platform-web:local -o spdx-json=/output/image-web-final.spdx.json
          for sbom in artifacts/sbom/*.spdx.json; do uvx --from spdx-tools==0.8.3 pyspdxtools -i "$sbom"; done

      - name: Block Critical and High vulnerabilities in final images
        run: |
          # v0.69.3, manifest-list digest sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c image --severity HIGH,CRITICAL --exit-code 1 --no-progress operations-ai-platform-api:local
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c image --severity HIGH,CRITICAL --exit-code 1 --no-progress operations-ai-platform-web:local

      - name: Build and inspect Chrome and Edge extension artifacts
        run: |
          pnpm --filter extension lint
          pnpm --filter extension typecheck
          pnpm --filter extension test
          pnpm --filter extension package:chrome
          pnpm --filter extension package:edge
          mkdir -p artifacts/extension/chrome artifacts/extension/edge
          unzip -q apps/extension/release/operations-capture-extension-chrome-0.1.0.zip -d artifacts/extension/chrome
          unzip -q apps/extension/release/operations-capture-extension-edge-0.1.0.zip -d artifacts/extension/edge
          uv run --project apps/api python scripts/release-security.py verify-artifact --kind extension --path artifacts/extension/chrome
          uv run --project apps/api python scripts/release-security.py verify-artifact --kind extension --path artifacts/extension/edge
          uv run --project apps/api python scripts/release-security.py verify-sbom --path artifacts/extension/chrome/sbom.spdx.json
          uv run --project apps/api python scripts/release-security.py verify-sbom --path artifacts/extension/edge/sbom.spdx.json
          uvx --from spdx-tools==0.8.3 pyspdxtools -i artifacts/extension/chrome/sbom.spdx.json
          uvx --from spdx-tools==0.8.3 pyspdxtools -i artifacts/extension/edge/sbom.spdx.json

      - name: Run foundation browser smoke without external platforms
        run: |
          pnpm --filter e2e exec playwright install --with-deps chrome
          mkdir -p artifacts/demo-screenshot
          DEMO_SCREENSHOT_OUTPUT="$PWD/artifacts/demo-screenshot/public-demo-rendered.png" pnpm --filter e2e test

      - name: Verify isolated fresh install and persistence
        run: bash scripts/verify-fresh-install.sh

      # v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sbom-and-release-security-${{ github.sha }}
          path: |
            artifacts/sbom
            artifacts/demo-screenshot
          if-no-files-found: error

      - name: Show service logs after failure
        if: failure()
        run: docker compose -f infra/docker/compose.yml logs --no-color

      - name: Stop isolated integration dependencies
        if: always()
        run: docker compose -f infra/docker/compose.yml down -v
