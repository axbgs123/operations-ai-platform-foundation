name: operations-ai-platform

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    environment:
      POSTGRES_DB: operations_ai
      POSTGRES_USER: operations_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operations_ai -d operations_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-operations-ai}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-development-only}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "9001:9001"
    volumes:
      - object-storage-data:/data

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: development
      APP_MOCK_MODE: "true"
      DATABASE_URL: postgresql+psycopg://operations_ai:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/operations_ai
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://object-storage:9000
      S3_BUCKET: operations-ai
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-operations-ai}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-development-only}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "8000:8000"

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    command:
      [
        "/app/.venv/bin/celery",
        "-A",
        "app.worker:celery_app",
        "worker",
        "--loglevel=INFO",
      ]
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_MOCK_MODE: "true"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  object-storage-data:
  postgres-data:
  redis-data:
