[project]
name = "api"
version = "0.1.0"
description = "API for the operations AI analysis and generation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1,<26",
    "celery[redis]>=5.6,<5.7",
    "cryptography>=48.0.1,<49",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.139.2",
    "openpyxl>=3.1,<4",
    "pillow>=11,<13",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "pypdf>=5,<7",
    "sqlalchemy>=2.0,<2.1",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "httpx2>=2.7.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.15.22",
    "types-openpyxl>=3.1.5.20260518",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
